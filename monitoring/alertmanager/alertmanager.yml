route:
  receiver: slack
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: slack
    slack_configs:
      # 웹훅 URL은 시크릿이므로 git이 아니라 서버의 파일에서 읽는다.
      # 서버에 ~/monitoring/alertmanager/slack_url 파일로 Slack Incoming Webhook URL을 넣을 것.
      - api_url_file: /etc/alertmanager/slack_url
        channel: '#alerts'   # (Incoming Webhook은 보통 웹훅에 지정된 채널로 감)
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}
