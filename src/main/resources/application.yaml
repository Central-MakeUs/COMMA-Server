spring:
  application:
    name: COMMA
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      # 스키마는 Flyway가 관리한다. Hibernate는 검증만(자동 변경 금지).
      ddl-auto: validate
  flyway:
    enabled: true
    # 기존 운영 DB(테이블 있음)는 V1을 실행하지 않고 baseline 처리, 빈 DB는 V1부터 실행
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
      file-size-threshold: 0    # 메모리에 쌓지 않고 임시파일로 스트리밍

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000      # 1시간 (3,600초)
  refresh-token-expiration: 1209600000  # 2주 (1,209,600초)

# 프론트 SDK 마이그레이션 기간 동안 기존 code 교환 방식과 SDK 토큰 방식을 함께 지원한다.
# 프론트 전환이 끝나면 client-secret/team-id/key-id/private-key(=code 교환 전용)는 지운다.
kakao:
  client-id: ${KAKAO_CLIENT_ID}

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}

apple:
  client-id: ${APPLE_CLIENT_ID}
  team-id: ${APPLE_TEAM_ID}
  key-id: ${APPLE_KEY_ID}
  private-key: ${APPLE_PRIVATE_KEY}

# 모니터링 (Actuator)
# health만 외부 공개(업타임 체크용, 상세는 숨김). prometheus 등 나머지는 인증 게이트(SecurityConfig).
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false
  metrics:
    distribution:
      # http 요청 지연 히스토그램 버킷 노출 → Prometheus p95/heatmap 가능
      percentiles-histogram:
        http.server.requests: true

# OCI Object Storage (S3 호환) — 업로드/삭제는 항상 이 원본으로 직접 간다.
oci:
  storage:
    endpoint: ${OCI_S3_ENDPOINT}      # https://{namespace}.compat.objectstorage.{region}.oraclecloud.com
    region: ${OCI_S3_REGION}          # 예: ap-chuncheon-1
    bucket: ${OCI_S3_BUCKET}          # 예: comma-media
    access-key: ${OCI_S3_ACCESS_KEY}  # Customer Secret Key
    secret-key: ${OCI_S3_SECRET_KEY}

# 이미지 읽기 URL(공개 GET) 조립 기준. CDN(Cloudflare) 도메인을 앞단에 붙이면 MEDIA_CDN_BASE_URL만
# 채우면 된다 — 안 정해져있으면 OCI 원본 엔드포인트로 그대로 폴백(지금까지의 동작과 동일).
media:
  cdn-base-url: ${MEDIA_CDN_BASE_URL:${oci.storage.endpoint}}
